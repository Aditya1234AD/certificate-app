<!doctype html>
<html>
<head><meta charset="utf-8"><title>Admin - Applicants</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4 bg-light">
  <div class="container">
    <h3>Applicants</h3>
    <table class="table table-striped">
      <thead><tr><th>ID</th><th>Name</th><th>Applied For</th><th>Files</th><th>Time</th></tr></thead>
      <tbody>
      {% for a in applicants %}
        <tr>
          <td>{{a.id}}</td>
          <td>{{a.name}}<br><small>{{a.email}} / {{a.phone}}</small></td>
          <td>{{a.applied_for}}</td>
          <td>
            {% for f in a.uploaded_files %}
              {% if f %}
                {% if use_s3 %}
                  <div><small>{{f}}</small></div>
                {% else %}
                  <a href="/download?path={{f|urlencode}}">Download</a><br>
                {% endif %}
              {% endif %}
            {% endfor %}
          </td>
          <td>{{a.created_at}}</td>
        </tr>
      {% endfor %}
      </tbody>
    </table>
  </div>
</body>
</html>
