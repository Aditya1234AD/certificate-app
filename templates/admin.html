<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>
</head>
<body>

<h2>Submitted Applications</h2>

<table border="1" cellpadding="5">
<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Village</th>
    <th>Post</th>
    <th>GP</th>
    <th>PIN</th>
    <th>District</th>
    <th>State</th>
    <th>Aadhar</th>
    <th>ROR</th>
    <th>Father Aadhar</th>
    <th>Photo</th>
</tr>

{% for app in applications %}
<tr>
    <td>{{ app[0] }}</td>
    <td>{{ app[1] }}</td>
    <td>{{ app[2] }}</td>
    <td>{{ app[3] }}</td>
    <td>{{ app[4] }}</td>
    <td>{{ app[5] }}</td>
    <td>{{ app[6] }}</td>
    <td>{{ app[7] }}</td>

    <td>{{ app[8] }}</td>
    <td>{{ app[9] }}</td>
    <td>{{ app[10] }}</td>
    <td>{{ app[11] }}</td>
</tr>
{% endfor %}

</table>

</body>
</html>
