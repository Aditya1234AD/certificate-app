<!DOCTYPE html>
<html>
<head>
    <title>Check Application Status</title>

    <style>
        body {
            font-family: Arial;
            background: #000;   /* Match dark theme */
            padding: 20px;
            color: white;
            transition: background 0.5s ease;
        }

        .box {
            width: 380px;
            margin: auto;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(6px);
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 0 15px rgba(255,255,255,0.15);
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .box:hover {
            transform: translateY(-4px);
            box-shadow: 0 0 25px rgba(255,255,255,0.25);
        }

        h2 {
            color: #4b7bec;
            margin-bottom: 15px;
            transition: color 0.3s ease;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 6px;
            border: 1px solid #aaa;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        input:focus {
            border-color: #4b7bec;
            box-shadow: 0 0 5px rgba(75,123,236,0.5);
            outline: none;
        }

        button {
            padding: 12px;
            width: 100%;
            background: #4b7bec;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.2s ease;
        }

        button:hover {
            background: #3867d6;
            transform: scale(1.03);
        }

        /* 🌈 RAINBOW CONTAINER */
        .rainbow-container {
            margin-top: 20px !important;
            padding: 15px !important;
            border-radius: 14px !important;

            background: linear-gradient(45deg,
                red, orange, yellow, green, cyan, blue, violet
            ) !important;

            background-size: 600% 600% !important;
            animation: rainbowMove 4s ease infinite !important;

            color: white !important;
            font-size: 18px !important;
            font-weight: bold;

            opacity: 1 !important;
            transform: translateY(0) !important;
            transition: box-shadow 0.3s ease, transform 0.3s ease;
        }

        .rainbow-container:hover {
            box-shadow: 0px 0px 25px rgba(255,255,255,0.4);
            transform: translateY(-3px);
        }

        @keyframes rainbowMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>

</head>
<body>

<div class="box">
    <h2>Check Application Status</h2>

    <form action="/check_status" method="POST">
        <input type="text" name="mobile" placeholder="Enter your mobile number" required>
        <button type="submit">Check Status</button>
    </form>

    <!-- 🌈 Rainbow Container -->
    <div id="rainbowBox" class="rainbow-container">

        {% if status %}
            <p><b>Your application status:</b> {{ status }}</p>

        {% elif message %}
            <p>{{ message }}</p>

        {% else %}
            <!-- Empty placeholder to maintain size -->
            <p style="opacity:0;">.</p>
        {% endif %}

    </div>
</div>

</body>
</html>
