<!DOCTYPE html>
<html>
<head>
    <title>Check Application Status</title>

    <style>
        body {
            font-family: Arial;
            background: #eef2f3;
            padding: 20px;
        }

        .box {
            width: 350px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            text-align: center;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 6px;
            border: 1px solid #aaa;
        }

        button {
            padding: 12px;
            width: 100%;
            background: #007bff;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 6px;
        }

        /* 🌈 RAINBOW CONTAINER */
        .rainbow-container {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;

            background: linear-gradient(45deg,
                red, orange, yellow, green, cyan, blue, violet
            );
            background-size: 600% 600%;
            animation: rainbowMove 5s ease infinite;

            color: white;
            font-size: 18px;

            opacity: 0;
            transform: translateY(20px);
            transition: all 0.6s ease-out;
        }

        /* Show when content exists */
        .rainbow-container.show {
            opacity: 1;
            transform: translateY(0);
        }

        @keyframes rainbowMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>

</head>
<body>

<div class="box">
    <h2>Check Application Status</h2>

    <form action="/check_status" method="POST">
        <input type="text" name="mobile" placeholder="Enter your mobile number" required>
        <button type="submit">Check Status</button>
    </form>

    <!-- 🌈 Rainbow Box Wrapper -->
    <div id="rainbowBox" class="rainbow-container">
        {% if status %}
            <p><b>Your application status:</b> {{ status }}</p>
        {% endif %}

        {% if message %}
            <p>{{ message }}</p>
        {% endif %}
    </div>
</div>


<script>
    // Enable animation ONLY if status/message exists
    window.onload = function() {
        let box = document.getElementById("rainbowBox");
        if (box.innerText.trim().length > 0) {
            box.classList.add("show");
        }
    }
</script>

</body>
</html>
