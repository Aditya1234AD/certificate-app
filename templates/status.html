<!DOCTYPE html>
<html>
<head>
    <title>Check Application Status</title>

    <style>
        body {
            font-family: Arial;
            background: #eef2f3;
            padding: 20px;
        }

        .box {
            width: 350px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            text-align: center;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 6px;
            border: 1px solid #aaa;
        }

        button {
            padding: 12px;
            width: 100%;
            background: #007bff;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 6px;
        }

        /* 🌈 RAINBOW CONTAINER */
        .rainbow-container {
            margin-top: 20px !important;
            padding: 15px !important;
            border-radius: 10px !important;

            background: linear-gradient(45deg,
                red, orange, yellow, green, cyan, blue, violet
            ) !important;

            background-size: 600% 600% !important;
            animation: rainbowMove 5s ease infinite !important;

            color: white !important;
            font-size: 18px !important;

            opacity: 1 !important;
            transform: translateY(0) !important;
        }

        @keyframes rainbowMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>

</head>
<body>

<div class="box">
    <h2>Check Application Status</h2>

    <form action="/check_status" method="POST">
        <input type="text" name="mobile" placeholder="Enter your mobile number" required>
        <button type="submit">Check Status</button>
    </form>

    <!-- 🌈 Rainbow Container -->
    <div id="rainbowBox" class="rainbow-container">

        {% if status %}
            <p><b>Your application status:</b> {{ status }}</p>

        {% elif message %}
            <p>{{ message }}</p>

        {% else %}
            <!-- Dummy text to make sure background shows -->
            <p style="opacity:0;">.</p>
        {% endif %}

    </div>
</div>

</body>
</html>
