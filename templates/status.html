<!DOCTYPE html>
<html>
<head>
    <title>Check Application Status</title>
    <style>
        body {
            font-family: Arial;
            background: #eef2f3;
            padding: 20px;
        }

        .box {
            width: 350px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            text-align: center;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 6px;
            border: 1px solid #aaa;
        }

        button {
            padding: 12px;
            width: 100%;
            background: #007bff;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 6px;
        }

        /* Rainbow Transition Container */
.transition-box {
    padding: 15px;
    border-radius: 10px;

    /* Rainbow gradient background */
    background: linear-gradient(45deg,
        red, orange, yellow, green, cyan, blue, violet
    );

    background-size: 400% 400%;
    animation: rainbowMove 6s ease infinite;

    opacity: 0;
    transform: translateY(10px);
    transition: all 0.6s ease;
}

/* When visible */
.transition-box.show {
    opacity: 1;
    transform: translateY(0);
}

/* Rainbow animation movement */
@keyframes rainbowMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}
    </style>
</head>
<body>

<div class="box">
    <h2>Check Application Status</h2>

    <form action="/check_status" method="POST">
        <input type="text" name="mobile" placeholder="Enter your mobile number" required>
        <button type="submit">Check Status</button>
    </form>

    <div id="resultBox" class="transition-box">
        {% if status %}
            <p style="margin-top:20px; font-size:18px;">
                <b>Your application status:</b> {{ status }}
            </p>
        {% endif %}

        {% if message %}
            <p style="margin-top:20px; font-size:18px; color: grey;">
                {{ message }}
            </p>
        {% endif %}
    </div>
</div>

<script>
    // Show animation after content loads
    window.onload = function() {
        const box = document.getElementById("resultBox");
        if (box.innerText.trim().length > 0) {
            box.classList.add("show");
        }
    }
</script>

</body>
</html>
