<!DOCTYPE html>
<html>
<head>
    <title>Check Application Status</title>
    <style>
        body {
            font-family: Arial;
            background: #eef2f3;
            padding: 20px;
        }

        .box {
            width: 350px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            text-align: center;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 6px;
            border: 1px solid #aaa;
        }

        button {
            padding: 12px;
            width: 100%;
            background: #007bff;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>Check Application Status</h2>

    <form action="/check_status" method="POST">
        <input type="text" name="mobile" placeholder="Enter your mobile number" required>
        <button type="submit">Check Status</button>
    </form>

    {% if status %}
        <p style="margin-top:20px; font-size:18px;">
            <b>Your application status:</b> {{ status }}
        </p>
    {% endif %}

    {% if message %}
        <p style="margin-top:20px; font-size:18px; color: grey;">
            {{ message }}
        </p>
    {% endif %}
</div>

</body>
</html>
