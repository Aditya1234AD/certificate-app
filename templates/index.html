<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apply Certificate</title>

<style>
body{
    background:linear-gradient(135deg,#0a0f1f,#020d1c,#001f3f);
    padding:25px;
    font-family:Poppins,sans-serif;
    color:white;
}

.container{
    max-width:760px;
    margin:auto;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(12px);
    border-radius:20px;
    padding:30px;
    box-shadow:0 0 25px rgba(0,170,255,0.4);
}

h2{
    text-align:center;
    color:#74d2ff;
    font-size:28px;
    margin-bottom:20px;
}

.box{
    margin-bottom:22px;
    background:rgba(255,255,255,0.1);
    padding:20px;
    border-radius:14px;
    border:1px solid rgba(0,170,255,0.3);
}

label{
    margin-top:14px;
    display:block;
    color:#b0eaff;
    font-weight:600;
}

input,select{
    width:100%;
    padding:12px;
    margin-top:6px;
    border-radius:8px;
    border:1px solid #4fc3f7;
    background:rgba(10,20,33,0.5);
    color:#aef3ff;
    outline:none;
}

button{
    width:100%;
    padding:15px;
    margin-top:10px;
    background:#00aaff;
    border:none;
    border-radius:10px;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#0088cc;
    transform:scale(1.03);
}

a{
    color:#4fc3f7;
    text-decoration:none;
    font-weight:bold;
}

.link-container{text-align:center;margin-top:20px;}
</style>

</head>

<body>

<div class="container">
<h2>Certificate Application Form</h2>
<form action="/submit" method="POST" enctype="multipart/form-data">

<div class="box">
<h3>Select Certificate Type</h3>
<select name="cert_type" required>
    <option value="" disabled selected>-- Select Certificate Type --</option>
    <option value="Caste Certificate">Caste Certificate</option>
    <option value="Income Certificate">Income Certificate</option>
    <option value="Resident Certificate">Resident Certificate</option>
</select>
</div>

<div class="box">
<h3>Applicant Details</h3>

<label>Name:</label><input type="text" name="name" required>
<label>Mobile:</label><input type="text" name="mobile" required>
<label>Village:</label><input type="text" name="village" required>
<label>Post Office:</label><input type="text" name="post" required>
<label>Gram Panchayat:</label><input type="text" name="gp" required>
<label>Pin Code:</label><input type="text" name="pin" required>
<label>District:</label><input type="text" name="district" required>
<label>State:</label><input type="text" name="state" required>
</div>

<div class="box">
<h3>Upload Documents</h3>
<label>Photo:</label><input type="file" name="photo" required>
<label>Aadhaar:</label><input type="file" name="aadhaar" required>
<label>Father's Aadhaar:</label><input type="file" name="father_aadhaar" required>
<label>ROR:</label><input type="file" name="ror">
</div>

<button type="submit">Submit Application</button>

<div class="link-container">
<a href="/status">Check Status</a> |
<a href="/admin-login">Admin Login</a>
</div>

</form>
</div>

</body>
</html>
