<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply Certificate</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #000000;   /* Black background */
        }

        .container {
            max-width: 650px;
            margin: auto;
        }

        .box {
            background: #ffffffcc;
            backdrop-filter: blur(5px);
            padding: 20px;
            border-radius: 14px;
            margin-bottom: 25px;
            box-shadow: 0px 0px 12px rgba(255,255,255,0.2); /* Soft white shadow */
        }

        h2 {
            text-align: center;
            margin-bottom: 15px;
            color: #4b7bec;  /* Blue for main title */
        }

        h3 {
            text-align: center;
            margin-bottom: 15px;
            color: white;   /* White for subtitles */
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 12px;
            color: white;  /* White labels for black background */
        }

        input[type="text"], input[type="file"], select {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border: 1px solid #444;
            border-radius: 6px;
            background: #fff;
        }

        button {
            background: #4b7bec;
            color: white;
            border: none;
            padding: 14px 20px;
            width: 100%;
            margin-top: 10px;
            font-size: 17px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #3867d6;
        }

        a {
            color: #74b9ff; /* Light blue link on black bg */
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Certificate Application Form</h2>

        <form action="/submit" method="POST" enctype="multipart/form-data">

            <!-- Certificate Type Box -->
            <div class="box">
                <h3>Select Certificate Type</h3>

                <label for="cert_type">Certificate Type:</label>
                <select name="cert_type" id="cert_type">
                    <option value="Caste Certificate">Caste Certificate</option>
                    <option value="Income Certificate">Income Certificate</option>
                    <option value="Resident Certificate">Resident Certificate</option>
                </select>
            </div>

            <!-- Personal Details Box -->
            <div class="box">
                <h3>Applicant Details</h3>

                <label>Enter Your Name:</label>
                <input type="text" name="name" required>

                <label>Enter Your Mobile Number:</label>
                <input type="text" name="mobile" required>

                <label>Village Name:</label>
                <input type="text" name="village" required>

                <label>Post Office:</label>
                <input type="text" name="post" required>

                <label>Gram Panchayat:</label>
                <input type="text" name="gp" required>

                <label>Pin Code:</label>
                <input type="text" name="pin" required>

                <label>District:</label>
                <input type="text" name="district" required>

                <label>State:</label>
                <input type="text" name="state" required>
            </div>

            <!-- Uploads Box -->
            <div class="box">
                <h3>Upload Required Documents</h3>

                <label>Applicant Photo:</label>
                <input type="file" name="photo" accept="image/*" required>

                <label>Applicant Aadhaar Card:</label>
                <input type="file" name="aadhaar" accept="image/*,application/pdf" required>

                <label>Father's Aadhaar Card:</label>
                <input type="file" name="father_aadhaar" accept="image/*,application/pdf" required>

                <label>ROR Document (optional):</label>
                <input type="file" name="ror" accept="image/*,application/pdf">
            </div>

            <button type="submit">Submit Application</button>

            <div style="text-align:center; margin-top: 20px;">
                <a href="/status" style="font-size: 18px; font-weight: bold; text-decoration: none;">
                    Check Application Status
                </a>
            </div>

        </form>
    </div>

</body>
</html>
