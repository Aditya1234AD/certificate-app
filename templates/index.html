<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apply Certificate</title>

<style>

/* ------------------ BACKGROUND ------------------ */
body {
    margin: 0;
    padding: 0;
    font-family: "Poppins", sans-serif;
    background: #0f0f0f;
    overflow-x: hidden;
}

/* ------------------ CENTERED CONTAINER ------------------ */
.container {
    max-width: 780px;
    margin: 40px auto;
    padding: 25px;
    animation: fadeIn 1s ease-out;
}

/* Fade animation */
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
}

/* ------------------ 3D FLOATING CARD STYLE ------------------ */
.box {
    background: rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(14px);
    border-radius: 18px;
    padding: 22px;
    margin-bottom: 28px;
    border: 1px solid rgba(255,255,255,0.2);

    box-shadow: 
        0 10px 25px rgba(0,0,0,0.4),
        inset 0 0 10px rgba(255,255,255,0.15);

    transform-style: preserve-3d;
    transform: translateZ(0);
    animation: floatCard 4s ease-in-out infinite;
}

/* Floating animation */
@keyframes floatCard {
    0%   { transform: translateY(0px) rotateX(0deg) rotateY(0deg); }
    50%  { transform: translateY(-12px) rotateX(2deg) rotateY(-2deg); }
    100% { transform: translateY(0px) rotateX(0deg) rotateY(0deg); }
}

/* ------------------ HEADINGS ------------------ */
h2 {
    text-align: center;
    color: white;
    font-size: 32px;
    margin-bottom: 20px;
    text-shadow: 0 0 12px rgba(255,255,255,0.6);
}

h3 {
    text-align: center;
    color: white;
    margin-bottom: 14px;
    font-size: 20px;
}

/* ------------------ FORM LABELS ------------------ */
label {
    display: block;
    margin-top: 12px;
    color: white;
    font-size: 16px;
    font-weight: 600;
}

/* ------------------ INPUT FIELDS ------------------ */
input[type="text"],
input[type="file"],
select {
    width: 100%;
    padding: 12px;
    margin-top: 6px;
    border-radius: 10px;
    border: none;
    background: rgba(255,255,255,0.15);
    color: white;
    font-size: 16px;
    outline: none;
    transition: 0.25s ease;
}

input:focus, select:focus {
    box-shadow: 0 0 10px rgba(255,255,255,0.5);
    transform: scale(1.03);
}

/* ------------------ BUTTON ------------------ */
button {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #4b7bec, #273c75);
    border: none;
    border-radius: 12px;
    font-size: 20px;
    cursor: pointer;
    color: white;
    margin-top: 10px;

    transform: translateZ(20px);
    transition: 0.3s ease;
}

button:hover {
    transform: translateZ(40px) scale(1.06);
    box-shadow: 0 0 18px #4b7bec;
}

/* ------------------ LINKS ------------------ */
.link-container {
    text-align: center;
    margin-top: 20px;
}

a {
    color: #78aaff;
    text-decoration: none;
    font-size: 18px;
    font-weight: bold;
}

a:hover {
    text-shadow: 0 0 10px white;
}

/* ------------------ MOBILE ------------------ */
@media (max-width: 600px) {
    h2 { font-size: 26px; }
    h3 { font-size: 18px; }
    .box { padding: 18px; }
}
</style>
</head>

<body>

<div class="container">

<h2>Certificate Application Form</h2>

<form action="/submit" method="POST" enctype="multipart/form-data">

<!-- ==================== Certificate Type ==================== -->
<div class="box">
    <h3>Select Certificate Type</h3>

    <label>Certificate Type:</label>
    <select name="cert_type" required>
        <option value="" disabled selected>-- Select Certificate Type --</option>
        <option value="Caste Certificate">Caste Certificate</option>
        <option value="Income Certificate">Income Certificate</option>
        <option value="Resident Certificate">Resident Certificate</option>
    </select>
</div>

<!-- ==================== Applicant Details ==================== -->
<div class="box">
    <h3>Applicant Details</h3>

    <label>Enter Your Name:</label><input type="text" name="name" required>
    <label>Enter Your Mobile:</label><input type="text" name="mobile" required>
    <label>Village Name:</label><input type="text" name="village" required>
    <label>Post Office:</label><input type="text" name="post" required>
    <label>Gram Panchayat:</label><input type="text" name="gp" required>
    <label>Pin Code:</label><input type="text" name="pin" required>
    <label>District:</label><input type="text" name="district" required>
    <label>State:</label><input type="text" name="state" required>
</div>

<!-- ==================== Upload Documents ==================== -->
<div class="box">
    <h3>Upload Required Documents</h3>

    <label>Applicant Photo:</label><input type="file" name="photo" accept="image/*" required>
    <label>Applicant Aadhaar:</label><input type="file" name="aadhaar" accept="image/*,application/pdf" required>
    <label>Father's Aadhaar:</label><input type="file" name="father_aadhaar" accept="image/*,application/pdf" required>
    <label>ROR Document (optional):</label><input type="file" name="ror" accept="image/*,application/pdf">
</div>

<button type="submit">Submit Application</button>

<div class="link-container">
    <a href="/status">Check Status</a> |
    <a href="/admin-login">Admin Login</a>
</div>

</form>
</div>

</body>
            </html>
