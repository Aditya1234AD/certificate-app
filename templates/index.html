<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apply Certificate</title>

<style>
/* ----------------- ANIMATED GRADIENT BACKGROUND ----------------- */
body {
    margin: 0;
    padding: 0;
    font-family: "Arial", sans-serif;
    overflow-x: hidden;
    background: linear-gradient(-45deg, #6a11cb, #2575fc, #ff6a00, #ee0979);
    background-size: 400% 400%;
    animation: gradientBG 10s ease infinite;
}

@keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* ----------------- CONTAINER GLASS EFFECT ----------------- */
.container {
    max-width: 800px;
    margin: 40px auto;
    background: rgba(255,255,255,0.13);
    backdrop-filter: blur(10px);
    padding: 28px;
    border-radius: 18px;
    border: 1px solid rgba(255,255,255,0.3);
    animation: fadeIn 1.2s ease;
    box-shadow: 0px 0px 25px rgba(255,255,255,0.3);
}

@keyframes fadeIn {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
}

/* ----------------- HEADINGS ----------------- */
h2 {
    text-align: center;
    font-size: 32px;
    font-weight: bold;
    color: white;
    text-shadow: 0 0 15px white;
    margin-bottom: 18px;
}

h3 {
    text-align: center;
    font-size: 22px;
    color: #fff;
    margin-bottom: 12px;
}

/* ----------------- SECTION BOX ----------------- */
.box {
    background: rgba(255,255,255,0.18);
    padding: 18px;
    border-radius: 14px;
    margin-bottom: 22px;
    border: 1px solid rgba(255,255,255,0.35);
    position: relative;
    overflow: hidden;
}

/* Shimmer animation */
.box::after {
    content: "";
    position: absolute;
    top: 0;
    left: -120%;
    width: 100%;
    height: 100%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.3), transparent);
    animation: shine 4s infinite;
}

@keyframes shine {
    0% { left: -120%; }
    100% { left: 120%; }
}

/* ----------------- INPUT FIELDS ----------------- */
label {
    font-size: 16px;
    color: #fff;
    display: block;
    margin-top: 12px;
    font-weight: bold;
}

input[type="text"],
input[type="file"],
select {
    width: 100%;
    padding: 12px;
    margin-top: 6px;
    border-radius: 10px;
    border: none;
    background: rgba(255,255,255,0.2);
    color: white;
    font-size: 16px;
    outline: none;
    transition: 0.3s ease;
}

input:focus,
select:focus {
    transform: scale(1.03);
    box-shadow: 0 0 15px #ffffffaa;
}

/* ----------------- ANIMATED BUTTON ----------------- */
button {
    width: 100%;
    padding: 15px;
    font-size: 20px;
    border-radius: 14px;
    border: none;
    cursor: pointer;
    color: white;
    background: linear-gradient(45deg, #ff6a00, #ee0979);
    animation: glow 2s infinite alternate;
    transition: 0.3s ease;
}

@keyframes glow {
    from { box-shadow: 0 0 10px #ff9a3c; }
    to { box-shadow: 0 0 25px #ee0979; }
}

button:hover {
    transform: scale(1.05);
}

/* ----------------- LINKS ----------------- */
.link-container {
    text-align: center;
    margin-top: 15px;
}

a {
    color: #fff;
    font-weight: bold;
    text-shadow: 0 0 10px white;
    font-size: 18px;
    text-decoration: none;
    margin: 0 8px;
}

a:hover {
    text-shadow: 0 0 20px white;
}

/* ----------------- MOBILE RESPONSIVE ----------------- */
@media(max-width:600px) {
    h2 { font-size: 26px; }
    h3 { font-size: 18px; }
}
</style>
</head>
<body>

<div class="container">

<h2>Certificate Application Form</h2>

<form action="/submit" method="POST" enctype="multipart/form-data">

<div class="box">
    <h3>Select Certificate Type</h3>
    <label>Certificate Type:</label>
    <select name="cert_type" required>
        <option value="" disabled selected>-- Select Certificate Type --</option>
        <option value="Caste Certificate">Caste Certificate</option>
        <option value="Income Certificate">Income Certificate</option>
        <option value="Resident Certificate">Resident Certificate</option>
    </select>
</div>

<div class="box">
    <h3>Applicant Details</h3>
    <label>Enter Your Name:</label><input type="text" name="name" required>
    <label>Enter Your Mobile Number:</label><input type="text" name="mobile" required>
    <label>Village Name:</label><input type="text" name="village" required>
    <label>Post Office:</label><input type="text" name="post" required>
    <label>Gram Panchayat:</label><input type="text" name="gp" required>
    <label>Pin Code:</label><input type="text" name="pin" required>
    <label>District:</label><input type="text" name="district" required>
    <label>State:</label><input type="text" name="state" required>
</div>

<div class="box">
    <h3>Upload Required Documents</h3>
    <label>Applicant Photo:</label><input type="file" name="photo" accept="image/*" required>
    <label>Applicant Aadhaar Card:</label><input type="file" name="aadhaar" accept="image/*,application/pdf" required>
    <label>Father's Aadhaar Card:</label><input type="file" name="father_aadhaar" accept="image/*,application/pdf" required>
    <label>ROR Document (optional):</label><input type="file" name="ror" accept="image/*,application/pdf">
</div>

<button type="submit">Submit Application</button>

<div class="link-container">
    <a href="/status">Check Status</a> |
    <a href="/admin-login">Admin Login</a>
</div>

</form>

</div>

</body>
                                      </html>
