<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apply Certificate</title>

<style>

/* ------------------ GLOBAL BACKGROUND ------------------ */
body {
    margin: 0;
    padding: 0;
    font-family: "Poppins", sans-serif;
    background: radial-gradient(circle at top, #1b2735, #090a0f);
    overflow-x: hidden;
}

/* ------------------ CONTAINER ------------------ */
.container {
    max-width: 780px;
    margin: 40px auto;
    padding: 25px;
    animation: fadeIn 0.9s ease-out;
}

/* Fade animation */
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
}

/* ------------------ 3D GLASS BOX ------------------ */
.box {
    background: rgba(255, 255, 255, 0.10);
    backdrop-filter: blur(14px);
    border-radius: 18px;
    padding: 22px;
    margin-bottom: 28px;
    border: 1px solid rgba(255,255,255,0.15);

    box-shadow: 
        0 10px 30px rgba(0,0,0,0.4),
        inset 0 0 8px rgba(255,255,255,0.1);

    transform-style: preserve-3d;
    animation: floatCard 5s ease-in-out infinite;
}

/* Floating effect */
@keyframes floatCard {
    0%   { transform: translateY(0px); }
    50%  { transform: translateY(-10px); }
    100% { transform: translateY(0px); }
}

/* ------------------ HEADINGS ------------------ */
h2 {
    text-align: center;
    color: white;
    font-size: 34px;
    margin-bottom: 20px;
    text-shadow: 0 0 12px rgba(255,255,255,0.5);
}

h3 {
    text-align: center;
    color: #e8e8e8;
    margin-bottom: 14px;
    font-size: 20px;
}

/* ------------------ LABELS ------------------ */
label {
    display: block;
    margin-top: 12px;
    color: #eaeaea;
    font-size: 15px;
    font-weight: 600;
}

/* ------------------ INPUTS ------------------ */
input[type="text"],
input[type="file"],
select {
    width: 100%;
    padding: 12px;
    margin-top: 6px;
    border-radius: 10px;
    border: none;
    background: rgba(255,255,255,0.14);
    color: white;
    font-size: 16px;
    outline: none;
    transition: 0.25s ease;
}

input:focus, select:focus {
    box-shadow: 0 0 12px #4b7bec;
    transform: scale(1.02);
}

/* ------------------ BUTTON ------------------ */
button {
    width: 100%;
    padding: 15px;
    background: linear-gradient(135deg, #4b7bec, #192a56);
    border: none;
    border-radius: 14px;
    font-size: 20px;
    cursor: pointer;
    color: white;
    margin-top: 18px;

    transition: 0.3s ease;
}

button:hover {
    transform: scale(1.05);
    box-shadow: 0 0 20px #4b7bec;
}

/* ------------------ LINKS ------------------ */
.link-container {
    text-align: center;
    margin-top: 20px;
}

a {
    color: #78aaff;
    text-decoration: none;
    font-size: 18px;
    font-weight: bold;
}

a:hover {
    text-shadow: 0 0 10px white;
}

/* ------------------ LOADING OVERLAY ------------------ */
#loadingOverlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.8);
    backdrop-filter: blur(6px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 9999;
}

/* Spinning loader */
.loader {
    width: 90px;
    height: 90px;
    border: 10px solid rgba(255,255,255,0.2);
    border-top: 10px solid #4b7bec;
    border-radius: 50%;
    animation: spin 1s linear infinite;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

/* ------------------ MOBILE ------------------ */
@media (max-width: 600px) {
    h2 { font-size: 26px; }
    .box { padding: 18px; }
}

</style>
</head>

<body>

<!-- Loading Overlay -->
<div id="loadingOverlay">
    <div class="loader"></div>
</div>

<div class="container">

<h2>Certificate Application Form</h2>

<form id="certForm" action="/submit" method="POST" enctype="multipart/form-data">

<!-- Certificate Type -->
<div class="box">
    <h3>Select Certificate Type</h3>
    <label>Certificate Type:</label>
    <select name="cert_type" required>
        <option value="" disabled selected>-- Select Certificate Type --</option>
        <option value="Caste Certificate">Caste Certificate</option>
        <option value="Income Certificate">Income Certificate</option>
        <option value="Resident Certificate">Resident Certificate</option>
    </select>
</div>

<!-- Applicant Details -->
<div class="box">
    <h3>Applicant Details</h3>

    <label>Enter Your Name:</label><input type="text" name="name" required>
    <label>Enter Your Mobile:</label><input type="text" name="mobile" required>
    <label>Village Name:</label><input type="text" name="village" required>
    <label>Post Office:</label><input type="text" name="post" required>
    <label>Gram Panchayat:</label><input type="text" name="gp" required>
    <label>Pin Code:</label><input type="text" name="pin" required>
    <label>District:</label><input type="text" name="district" required>
    <label>State:</label><input type="text" name="state" required>
</div>

<!-- Upload Section -->
<div class="box">
    <h3>Upload Required Documents</h3>

    <label>Applicant Photo:</label><input type="file" name="photo" accept="image/*" required>
    <label>Applicant Aadhaar:</label><input type="file" name="aadhaar" accept="image/*,application/pdf" required>
    <label>Father's Aadhaar:</label><input type="file" name="father_aadhaar" accept="image/*,application/pdf" required>
    <label>ROR Document (optional):</label><input type="file" name="ror" accept="image/*,application/pdf">
</div>

<button type="submit">Submit Application</button>

<div class="link-container">
    <a href="/status">Check Status</a> |
    <a href="/admin-login">Admin Login</a>
</div>

</form>
</div>

<script>
/* SHOW LOADING ANIMATION ON SUBMIT */
document.getElementById("certForm").addEventListener("submit", function() {
    document.getElementById("loadingOverlay").style.display = "flex";
});
</script>

</body>
                                                                            </html>
