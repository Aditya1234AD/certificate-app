<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Apply Certificate</title>
<style>
/* ---------- RESET / BOX SIZING ---------- */
* { box-sizing: border-box; margin: 0; padding: 0; }

/* ---------- BODY BACKGROUND ---------- */
body {
  font-family: "Poppins", sans-serif;
  background: radial-gradient(circle at 10% 10%, #152033 0%, #071018 45%, #020406 100%);
  color: #eaeef7;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
}

/* ---------- CENTERED PANE (GLOWING) ---------- */
.container {
  max-width: 820px;
  margin: 36px auto;
  padding: 28px;
  border-radius: 18px;
  background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.02));
  border: 1px solid rgba(255,255,255,0.06);
  position: relative;
  overflow: hidden; /* ensure children don't overflow */
  box-shadow: 0 8px 40px rgba(11,18,30,0.7);
  /* glowing animation (container glows, cards stay steady) */
  animation: containerGlow 3.6s ease-in-out infinite;
}

/* soft animated glowing border */
@keyframes containerGlow {
  0%   { box-shadow: 0 8px 40px rgba(11,18,30,0.6), 0 0 0 rgba(75,123,236,0); }
  50%  { box-shadow: 0 12px 60px rgba(11,18,30,0.75), 0 0 36px rgba(75,123,236,0.06); }
  100% { box-shadow: 0 8px 40px rgba(11,18,30,0.6), 0 0 0 rgba(75,123,236,0); }
}

/* ---------- FORM LAYOUT ---------- */
.header {
  text-align: center;
  margin-bottom: 18px;
}
h2 {
  color: #ffffff;
  font-size: 30px;
  letter-spacing: 0.6px;
  text-shadow: 0 0 8px rgba(255,255,255,0.06);
}
.subtitle {
  color: rgba(255,255,255,0.75);
  font-size: 13px;
  margin-top: 6px;
}

/* ---------- CARD (BOX) ---------- */
/* ensure card stays inside container; remove float animation */
.box {
  width: 100%;
  background: rgba(255,255,255,0.03);
  backdrop-filter: blur(6px);
  border-radius: 14px;
  padding: 18px;
  margin: 18px 0;
  border: 1px solid rgba(255,255,255,0.04);
  box-shadow: 0 6px 18px rgba(2,6,12,0.6), inset 0 1px 0 rgba(255,255,255,0.01);
}

/* card headings */
.box h3 {
  text-align: left;
  color: #e9f0ff;
  font-size: 18px;
  margin-bottom: 8px;
}

/* ---------- FORM FIELDS ---------- */
label {
  display: block;
  margin-top: 10px;
  color: rgba(230,235,255,0.9);
  font-size: 14px;
  font-weight: 600;
}

input[type="text"],
select,
input[type="file"] {
  width: 100%;
  padding: 11px 12px;
  margin-top: 6px;
  border-radius: 10px;
  border: none;
  background: rgba(255,255,255,0.04);
  color: #eef4ff;
  font-size: 15px;
  outline: none;
  transition: box-shadow .22s ease, transform .18s ease;
}

/* file input show shorter height on mobile */
input[type="file"] { padding: 9px 8px; }

/* focus state */
input:focus, select:focus {
  box-shadow: 0 6px 22px rgba(75,123,236,0.14);
  transform: translateY(-1px);
}

/* small two-column grid for some inputs on wide screens (keeps inside container) */
.grid-2 {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}
@media (max-width:720px) {
  .grid-2 { grid-template-columns: 1fr; }
}

/* ---------- SUBMIT BUTTON ---------- */
button[type="submit"] {
  display: block;
  width: 100%;
  padding: 13px 16px;
  margin-top: 14px;
  border-radius: 12px;
  border: none;
  font-size: 18px;
  font-weight: 700;
  letter-spacing: .4px;
  cursor: pointer;
  background: linear-gradient(135deg, #4b7bec 0%, #2b4aa4 100%);
  color: white;
  transition: transform .18s ease, box-shadow .18s ease;
}
button[type="submit"]:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(75,123,236,0.14); }
button[disabled] { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }

/* ---------- LINKS ---------- */
.link-container {
  text-align: center;
  margin-top: 12px;
  color: rgba(200,215,255,0.85);
}
.link-container a {
  color: #92b7ff;
  text-decoration: none;
  font-weight: 700;
  margin: 0 8px;
}
.link-container a:hover { text-shadow: 0 0 8px rgba(255,255,255,0.06); }

/* ---------- LOADING OVERLAY (SMOOTH) ---------- */
#loadingOverlay {
  position: fixed;
  inset: 0;
  display: none;              /* shown by JS */
  align-items: center;
  justify-content: center;
  z-index: 9999;
  background: linear-gradient(180deg, rgba(2,6,12,0.55), rgba(2,6,12,0.7));
  backdrop-filter: blur(4px);
}

/* panel inside overlay */
.loading-panel {
  display: flex;
  gap: 18px;
  align-items: center;
  padding: 20px 24px;
  border-radius: 14px;
  background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.02));
  border: 1px solid rgba(255,255,255,0.06);
  box-shadow: 0 10px 30px rgba(0,0,0,0.6);
  transform: translateY(10px);
  animation: panelIn .28s ease forwards;
}

/* spinner ring (smooth) */
.loader-ring {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  border: 6px solid rgba(255,255,255,0.14);
  border-top-color: #7fb0ff;
  animation: spin 0.95s linear infinite;
  flex: 0 0 auto;
}

/* animated text with stylish gradient & dots */
.submitting-text {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.title-anim {
  font-weight: 800;
  font-size: 17px;
  letter-spacing: 0.6px;
  /* gradient text */
  background: linear-gradient(90deg, #cfe3ff 0%, #ffffff 50%, #bfe0ff 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  text-transform: uppercase;
}
.subtitle-anim {
  font-size: 13px;
  color: rgba(220,230,255,0.85);
  display: flex;
  align-items: center;
  gap: 8px;
}

/* animated trailing dots */
.dot-anim {
  font-weight: 700;
  font-size: 16px;
  width: 40px;
  display: inline-block;
  text-align: left;
  color: #bfe0ff;
  animation: dots 1.4s steps(4, end) infinite;
}

/* animations */
@keyframes spin { 0%{transform:rotate(0)}100%{transform:rotate(360deg)} }
@keyframes dots {
  0%   { content: ""; transform: translateY(0); }
  25%  { content: "."; }
  50%  { content: ".."; }
  75%  { content: "..."; }
  100% { content: ""; }
}
/* panel entrance */
@keyframes panelIn { from { opacity: 0; transform: translateY(18px) scale(.98) } to { opacity:1; transform:none } }

/* responsive small panels */
@media (max-width:560px) {
  .loading-panel { padding: 14px 16px; gap:12px; }
  .loader-ring { width:48px; height:48px; border-width:5px; }
}

/* small helper to avoid file input text overflow */
input[type="file"]::-webkit-file-upload-button { visibility: hidden; }
input[type="file"]::before {
  content: "Choose file";
  display: inline-block;
  background: rgba(255,255,255,0.03);
  border-radius: 8px;
  padding: 6px 8px;
  margin-right: 10px;
  color: #dcecff;
  font-weight: 600;
  cursor: pointer;
}

/* ensure long content never overflows container */
.container, .box, input, select, button { max-width: 100%; word-break: break-word; }
</style>
</head>
<body>

<!-- LOADING OVERLAY -->
<div id="loadingOverlay" role="status" aria-hidden="true">
  <div class="loading-panel" aria-live="polite">
    <div class="loader-ring" aria-hidden="true"></div>
    <div class="submitting-text">
      <div class="title-anim">Submitting your application</div>
      <div class="subtitle-anim">
        Please wait <span class="dot-anim">...</span>
      </div>
    </div>
  </div>
</div>

<!-- MAIN CONTAINER -->
<div class="container" role="main" aria-labelledby="formHeading">
  <div class="header">
    <h2 id="formHeading">Certificate Application Form</h2>
    <div class="subtitle">Fill required details and upload documents</div>
  </div>

  <form id="certForm" action="/submit" method="POST" enctype="multipart/form-data" novalidate>
    <!-- Certificate Type -->
    <div class="box" aria-labelledby="certTypeHeading">
      <h3 id="certTypeHeading">Select Certificate Type</h3>
      <label for="cert_type">Certificate Type:</label>
      <select name="cert_type" id="cert_type" required>
        <option value="" disabled selected>-- Select Certificate Type --</option>
        <option value="Caste Certificate">Caste Certificate</option>
        <option value="Income Certificate">Income Certificate</option>
        <option value="Resident Certificate">Resident Certificate</option>
      </select>
    </div>

    <!-- Applicant Details -->
    <div class="box" aria-labelledby="appDetailsHeading">
      <h3 id="appDetailsHeading">Applicant Details</h3>

      <label for="name">Enter Your Name:</label>
      <input id="name" name="name" type="text" required autocomplete="name" />

      <label for="mobile">Enter Your Mobile:</label>
      <input id="mobile" name="mobile" type="text" inputmode="tel" required autocomplete="tel" />

      <div class="grid-2">
        <div>
          <label for="village">Village Name:</label>
          <input id="village" name="village" type="text" required />
        </div>
        <div>
          <label for="post">Post Office:</label>
          <input id="post" name="post" type="text" required />
        </div>
      </div>

      <div class="grid-2">
        <div>
          <label for="gp">Gram Panchayat:</label>
          <input id="gp" name="gp" type="text" required />
        </div>
        <div>
          <label for="pin">Pin Code:</label>
          <input id="pin" name="pin" type="text" inputmode="numeric" required />
        </div>
      </div>

      <div class="grid-2">
        <div>
          <label for="district">District:</label>
          <input id="district" name="district" type="text" required />
        </div>
        <div>
          <label for="state">State:</label>
          <input id="state" name="state" type="text" required />
        </div>
      </div>
    </div>

    <!-- Upload Documents -->
    <div class="box" aria-labelledby="uploadHeading">
      <h3 id="uploadHeading">Upload Required Documents</h3>

      <label for="photo">Applicant Photo:</label>
      <input id="photo" name="photo" type="file" accept="image/*" required />

      <label for="aadhaar">Applicant Aadhaar:</label>
      <input id="aadhaar" name="aadhaar" type="file" accept="image/*,application/pdf" required />

      <label for="father_aadhaar">Father's Aadhaar:</label>
      <input id="father_aadhaar" name="father_aadhaar" type="file" accept="image/*,application/pdf" required />

      <label for="ror">ROR Document (optional):</label>
      <input id="ror" name="ror" type="file" accept="image/*,application/pdf" />
    </div>

    <button id="submitBtn" type="submit">Submit Application</button>

    <div class="link-container" aria-hidden="false">
      <a href="/status">Check Status</a> |
      <a href="/admin-login">Admin Login</a>
    </div>
  </form>
</div>

<script>
/* Handle overlay + disable submit to prevent double clicks.
   We show overlay and allow actual form submission to continue.
*/
(function(){
  const form = document.getElementById('certForm');
  const overlay = document.getElementById('loadingOverlay');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', function(e){
    // If form invalid according to browser, let the browser show it and do not show overlay.
    if(!form.checkValidity()){
      // allow browser to show validation messages
      return;
    }

    // Show overlay and disable button to prevent multiple submits
    overlay.style.display = 'flex';
    overlay.setAttribute('aria-hidden', 'false');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Submitting...';

    // Accessibility focus trap: move focus to overlay content
    try {
      overlay.querySelector('.loading-panel').focus();
    } catch (err) {}

    // Do NOT call e.preventDefault() so the form actually submits to the server.
    // The overlay will remain visible while the network request completes.
  });

  // Optional: hide overlay if user navigates away or on pagehide (graceful)
  window.addEventListener('pagehide', () => {
    overlay.style.display = 'none';
  });
})();
</script>
</body>
      </html>
