<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Apply for Certificate</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
  <h2>Apply Online - Caste / Income Certificate</h2>
  <form method="POST" enctype="multipart/form-data">
    <div class="mb-3">
      <label>Name</label>
      <input name="name" class="form-control" required>
    </div>
    <div class="mb-3 row">
      <div class="col">
        <label>Email</label>
        <input name="email" type="email" class="form-control" required>
      </div>
      <div class="col">
        <label>Phone</label>
        <input name="phone" class="form-control">
      </div>
    </div>
    <div class="mb-3 row">
      <div class="col"><label>Village</label><input name="village" class="form-control"></div>
      <div class="col"><label>District</label><input name="district" class="form-control"></div>
      <div class="col"><label>State</label><input name="state" class="form-control"></div>
    </div>

    <div class="mb-3">
      <label>Apply for</label>
      <select name="applied_for" class="form-select" required>
        <option value="caste">Caste Certificate</option>
        <option value="income">Income Certificate</option>
        <option value="both">Both</option>
      </select>
    </div>

    <div class="mb-3">
      <label>Upload Documents (pdf, png, jpg). For example: Aadhar, ROR, Photo etc.</label>
      <input type="file" accept=".pdf,.png,.jpg,.jpeg" name="file1" class="form-control mb-2">
      <input type="file" accept=".pdf,.png,.jpg,.jpeg" name="file2" class="form-control mb-2">
      <input type="file" accept=".pdf,.png,.jpg,.jpeg" name="file3" class="form-control mb-2">
    </div>

    <button class="btn btn-primary">Submit Application</button>
  </form>
</div>
</body>
</html>
