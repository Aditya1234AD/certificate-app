<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply Certificate</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            background: #fff;
            margin: auto;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 15px;
        }

        input[type="text"], input[type="file"], select {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 12px 20px;
            width: 100%;
            margin-top: 25px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Certificate Application Form</h2>

        <form action="/submit" method="POST" enctype="multipart/form-data">

            <!-- Certificate Type -->
            <label for="cert_type">Select Certificate Type:</label>
            <select name="cert_type" id="cert_type">
                <option value="Caste Certificate">Caste Certificate</option>
                <option value="Income Certificate">Income Certificate</option>
                <option value="Resident Certificate">Resident Certificate</option>
            </select>

            <!-- Text Inputs -->
            <label>Enter Your Name:</label>
            <input type="text" name="name" required>

            <label>Enter Village Name:</label>
            <input type="text" name="village" required>

            <label>Enter Post Office:</label>
            <input type="text" name="post" required>

            <label>Enter Gram Panchayat:</label>
            <input type="text" name="gp" required>

            <label>Enter Pin Code:</label>
            <input type="text" name="pin" required>

            <label>Enter District:</label>
            <input type="text" name="district" required>

            <label>Enter State:</label>
            <input type="text" name="state" required>

            <!-- Upload Files -->
            <label>Upload Applicant Photo:</label>
            <input type="file" name="photo" accept="image/*" required>

            <label>Upload Applicant Aadhaar Card:</label>
            <input type="file" name="aadhaar" accept="image/*,application/pdf" required>

            <label>Upload Father's Aadhaar Card:</label>
            <input type="file" name="father_aadhaar" accept="image/*,application/pdf" required>

            <label>Upload ROR (if required):</label>
            <input type="file" name="ror" accept="image/*,application/pdf">

            <button type="submit">Submit Application</button>
        </form>
    </div>

</body>
</html>
