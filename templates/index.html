<!DOCTYPE html>
<html>
<head>
    <title>Apply for Certificate</title>
</head>
<body>

<h2>Apply for Caste / Income / Resident Certificate</h2>

<form action="/submit" method="POST" enctype="multipart/form-data">

    <label>Enter your name:</label><br>
    <input type="text" name="name" required><br><br>

    <label>Village:</label><br>
    <input type="text" name="village" required><br><br>

    <label>Post Office:</label><br>
    <input type="text" name="post" required><br><br>

    <label>Gram Panchayat:</label><br>
    <input type="text" name="gp" required><br><br>

    <label>PIN Code:</label><br>
    <input type="text" name="pin" required><br><br>

    <label>District:</label><br>
    <input type="text" name="district" required><br><br>

    <label>State:</label><br>
    <input type="text" name="state" required><br><br>

    <label>Aadhar Card Upload:</label><br>
    <input type="file" name="aadhar" required><br><br>

    <label>ROR Upload:</label><br>
    <input type="file" name="ror" required><br><br>

    <label>Father Aadhar Upload:</label><br>
    <input type="file" name="father_aadhar" required><br><br>

    <label>Applicant Photo:</label><br>
    <input type="file" name="applicant_photo" required><br><br>

    <button type="submit">Submit Application</button>

</form>

</body>
</html>
