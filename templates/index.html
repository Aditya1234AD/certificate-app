<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Apply Certificate</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: "Poppins", sans-serif;
  min-height: 100vh;
  background: url("static/file_00000000fbac7208b34ecab5e99ddd76.png") no-repeat center center fixed;
  background-size: cover;
  position: relative;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.35);
  z-index: -1;
}

.container {
  max-width: 820px;
  margin: 36px auto;
  padding: 28px;
  border-radius: 18px;
  background: rgba(0,0,0,0.45);
  backdrop-filter: blur(8px);
  animation: slideIn 1.2s ease forwards;
}

@keyframes slideIn {
  from { opacity: 0; transform: translateX(-50px); }
  to { opacity: 1; transform: translateX(0); }
}

.header {
  text-align: center;
  margin-bottom: 20px;
}

h2 {
  color: #fff;
  font-size: 30px;
}

.subtitle {
  color: #dce3ff;
  font-size: 13px;
}

.box {
  background: rgba(255,255,255,0.06);
  border-radius: 14px;
  padding: 18px;
  margin: 18px 0;
}

.box h3 {
  color: #fff;
  margin-bottom: 10px;
}

label {
  color: #e6ebff;
  font-size: 14px;
  font-weight: 600;
  margin-top: 10px;
  display: block;
}

input, select {
  width: 100%;
  padding: 11px;
  margin-top: 6px;
  border-radius: 10px;
  border: none;
  background: rgba(255,255,255,0.08);
  color: white;
  font-size: 15px;
}

input:focus, select:focus {
  outline: none;
  box-shadow: 0 0 10px rgba(0,0,0,0.4);
}

.grid-2 {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

@media(max-width:720px) {
  .grid-2 { grid-template-columns: 1fr; }
}

button {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: none;
  font-size: 18px;
  font-weight: bold;
  background: linear-gradient(135deg, #4b7bec, #2b4aa4);
  color: white;
  cursor: pointer;
  margin-top: 14px;
}

button:hover {
  box-shadow: 0 10px 30px rgba(75,123,236,0.3);
}

.link-container {
  text-align: center;
  margin-top: 12px;
}

.link-container a {
  color: #9ac1ff;
  font-weight: bold;
  text-decoration: none;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h2>Certificate Application Form</h2>
    <div class="subtitle">Fill required details and upload documents</div>
  </div>

  <!-- APPLICATION FORM -->
  <form action="/submit" method="POST" enctype="multipart/form-data">

    <div class="box">
      <h3>Select Certificate Type</h3>
      <select name="cert_type" required>
        <option value="" disabled selected>-- Select Certificate --</option>
        <option>Caste Certificate</option>
        <option>Income Certificate</option>
        <option>Resident Certificate</option>
      </select>
    </div>

    <div class="box">
      <h3>Applicant Details</h3>

      <label>Name</label>
      <input type="text" name="name" placeholder="Enter full name" required>

      <label>Mobile Number</label>
      <input type="tel"
             name="mobile"
             placeholder="10-digit mobile number"
             pattern="[6-9]{1}[0-9]{9}"
             title="Enter valid 10 digit Indian mobile number"
             required>

      <div class="grid-2">
        <input type="text" name="village" placeholder="Village" required>
        <input type="text" name="post" placeholder="Post Office" required>
      </div>

      <div class="grid-2">
        <input type="text" name="gp" placeholder="Gram Panchayat" required>
        <input type="text" name="pin" placeholder="PIN Code"
               pattern="[0-9]{6}" required>
      </div>

      <div class="grid-2">
        <input type="text" name="district" placeholder="District" required>
        <input type="text" name="state" placeholder="State" required>
      </div>
    </div>

    <div class="box">
      <h3>Upload Documents</h3>

      <label>Applicant Photo</label>
      <input type="file" name="photo" accept="image/*" required>

      <label>Applicant Aadhaar</label>
      <input type="file" name="aadhaar" accept="image/*,application/pdf" required>

      <label>Father's Aadhaar</label>
      <input type="file" name="father_aadhaar" accept="image/*,application/pdf" required>

      <label>ROR (Optional)</label>
      <input type="file" name="ror" accept="image/*,application/pdf">
    </div>

    <button type="submit">Submit Application</button>
  </form>

  <!-- STATUS CHECK -->
  <div class="box">
    <h3>Check Application Status</h3>
    <form method="POST" action="/check-status">
      <input type="tel" name="mobile" placeholder="Mobile number" required>
      <select name="cert_type" required>
        <option value="">Select Certificate</option>
        <option>Caste Certificate</option>
        <option>Income Certificate</option>
        <option>Resident Certificate</option>
      </select>
      <button type="submit">Check Status</button>
    </form>
  </div>

  <div class="link-container">
    <a href="/admin-login">Admin Login</a>
  </div>

</div>
</body>
    </html>
