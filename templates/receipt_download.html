<!DOCTYPE html>
<html>
<head>
    <title>Download Receipt</title>
    <style>
        body {
            font-family: Arial;
            background: #000;
            padding: 20px;
            color: white;
            text-align: center;
        }

        .box {
            width: 380px;
            margin: auto;
            background: rgba(255,255,255,0.12);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(255,255,255,0.18);
        }

        button {
            width: 100%;
            padding: 12px;
            background: #4b7bec;
            border: none;
            color: white;
            font-size: 17px;
            border-radius: 6px;
            margin-top: 12px;
            cursor: pointer;
        }

        button:hover {
            background: #3867d6;
        }

        p {
            font-size: 18px;
        }
    </style>
</head>
<body>

<div class="box">

    <h2>Receipt Download</h2>

    {% if paid %}
        <p style="color:#4bff4b;">Payment Verified ✅</p>
        <p>You can download your receipt now.</p>

        <a href="/download_receipt/{{ app_id }}">
            <button>Download Receipt</button>
        </a>

    {% else %}
        <p style="color:red;">Payment Not Done ❌</p>
        <p>Please pay ₹60 first to download your receipt.</p>

        <a href="/payment/{{ app_id }}">
            <button>Go to Payment Page</button>
        </a>
    {% endif %}

</div>

</body>
</html>
