<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment & Receipt</title>
<style>
body{font-family:Arial;background:#000;color:white;padding:20px;text-align:center;}
img{max-width:250px;margin-top:15px;}
button{padding:12px;background:#4b7bec;color:white;border:none;border-radius:6px;cursor:pointer;margin-top:10px;}
</style>
</head>
<body>
<h2>Application: {{ application['name'] }}</h2>
<p>Status: {{ application['status'] }}</p>
<p>Payment Status: {{ application['payment_status'] }}</p>

{% if application['payment_status'] == 'Pending' %}
<p>Scan QR to pay Rs. 60:</p>
<img src="/static/{{ qr_file }}" alt="QR Code"><br><br>
<form action="" method="POST" enctype="multipart/form-data">
<label>Upload Payment Screenshot:</label><br>
<input type="file" name="payment_ss" required><br><br>
<button type="submit">Submit Payment</button>
</form>
{% elif application['receipt_file'] %}
<p>Receipt is ready: <a href="/receipts/{{ application['receipt_file'] }}" target="_blank">Download Receipt</a></p>
{% endif %}
</body>
</html>
