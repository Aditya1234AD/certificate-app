<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
        }

        .box {
            background: rgba(255, 255, 255, 0.15);
            padding: 30px;
            border-radius: 16px;
            width: 85%;
            max-width: 500px;
            backdrop-filter: blur(6px);
            box-shadow: 0px 0px 15px rgba(0,0,0,0.3);
            animation: fadeIn 1s ease-in-out;
        }

        h2 {
            font-size: 26px;
            margin-bottom: 12px;
            color: #ffeb3b; /* Golden Yellow */
        }

        p {
            font-size: 18px;
            color: #e0e0e0;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            padding: 12px 20px;
            background: #ffeb3b;
            color: black;
            font-weight: bold;
            border-radius: 8px;
            font-size: 17px;
            transition: 0.3s;
        }

        a:hover {
            background: #fff;
            color: #000;
        }

        /* Fade animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>

</head>
<body>

    <div class="box">
        <h2>Your Application Has Been Submitted Successfully!</h2>
        <p>Thank you! We have received your request and will begin the processing shortly.</p>

        <a href="/">Submit Another Application</a>
    </div>

</body>
</html>
