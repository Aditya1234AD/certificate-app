<!DOCTYPE html>
<html>
<head>
    <title>Payment Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #000;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .box {
            width: 380px;
            margin: auto;
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(255,255,255,0.15);
        }

        img {
            width: 260px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        input[type="file"] {
            margin-top: 14px;
            padding: 10px;
            width: 90%;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #4b7bec;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 6px;
            margin-top: 12px;
            cursor: pointer;
        }

        button:hover {
            background: #3867d6;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>Pay ₹60 to Download Receipt</h2>

    <p>Scan the QR below and pay ₹60</p>

    <!-- Your QR Code -->
    <img src="static/Screenshot_20251201_163839.JPG" alt="QR Code">

    <form action="/upload_payment" method="POST" enctype="multipart/form-data">
        <input type="hidden" name="app_id" value="{{ app_id }}">

        <label>Upload Payment Screenshot:</label><br>
        <input type="file" name="payment_ss" required>

        <button type="submit">Submit Payment</button>
    </form>
</div>

</body>
</html>
